# nginx in front of ClawRouter (docs/deployment.md#https). Set CLAWROUTER_TRUSTED_PROXIES
# to nginx's address (127.0.0.1 on the same machine).
upstream clawrouter {
    server 127.0.0.1:8080;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name clawrouter.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name clawrouter.example.com;
    ssl_certificate     /etc/letsencrypt/live/clawrouter.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clawrouter.example.com/privkey.pem;

    # Configuration imports can be several MB; chat requests up to 10 MB.
    client_max_body_size 25m;

    location / {
        proxy_pass http://clawrouter;
        proxy_http_version 1.1;
        # The console's live channel (/api/ws) is a WebSocket; its origin check needs the Host.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # $http_host keeps a non-standard port, which the same-origin checks compare with Origin.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streamed model responses: pass them on as they arrive.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
