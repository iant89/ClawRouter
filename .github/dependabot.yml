# Automated dependency updates (SEC-018). Dependabot opens pull requests; CI (deps:check,
# check, the release dry run) runs on each, and nothing merges without review. The vendored
# ENTERPRISE-UI tarball is updated by hand (vendor/README.md). Bun is pinned in three places
# (the Dockerfile, the workflows and @types/bun): update them together, or
# release:package refuses to build.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
