# SEC-018: automated dependency updates. Every pull request goes through CI (bun run deps:check:
# lockfile, licenses, advisories). A new release waits 7 days first, so a hijacked version has
# time to be found and pulled. Bun is pinned in four places (CI, release and dependency
# workflows, Dockerfile, @types/bun) and deps:check fails until they agree: update them together.

version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Vendored tarball, updated by hand (vendor/README.md).
      - dependency-name: '@enterprise-ui/react'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
