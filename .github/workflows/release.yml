# Signed releases (SEC-020): source -> build -> artifacts -> SHA-256 -> signature -> GitHub release.
# Runs when a version tag (v1.2.3) is pushed. Signing is keyless (Sigstore): each signature is
# bound to this workflow, run for that tag, and recorded in the public transparency log, so
# there is no signing key to keep or lose. Verifying a release: docs/releases.md.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # SEC-026: a release passes the same security pipeline as every pull request before anything is built for it.
  security:
    permissions:
      contents: read
    uses: ./.github/workflows/security-pipeline.yml

  release:
    needs: security
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # the OIDC token Sigstore signs with
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: The tag matches package.json
        run: |
          version="$(bun -e 'console.log(require("./package.json").version)')"
          test "v${version}" = "$TAG" || { echo "Tag $TAG does not match package.json version $version"; exit 1; }
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      # Build, then the tarball, both SBOMs and SHA256SUMS in release/ (reproducible: same commit, same bytes).
      - run: bun run release:package --out release
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3 (cosign v3.1.4)
      - name: Sign every artifact and SHA256SUMS
        run: |
          for f in release/*; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: Verify before publishing
        run: bun run release:verify release --version "$VERSION" --signed
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "ClawRouter $VERSION" --generate-notes

  # What users download is checked too, the way docs/releases.md tells them to.
  verify-published:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3 (cosign v3.1.4)
      - name: Download the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir downloaded
      - name: Verify by hand (docs/releases.md)
        working-directory: downloaded
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}"
          cosign verify-blob --bundle SHA256SUMS.sigstore.json --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Verify with the release tool
        run: bun run release:verify downloaded --version "${TAG#v}" --signed
