name: CI

on:
  push:
    branches: [main]
  pull_request:
  # SEC-018: new advisories are published without a push; check the dependencies weekly too.
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # SEC-026: typecheck, unit, integration and security tests, dependency audit (SEC-018), secret
  # scanning, SAST, container scanning, SBOM (SEC-019) and build verification with the release
  # dry run (SEC-020): one pipeline, the same one releases run.
  security:
    uses: ./.github/workflows/security-pipeline.yml
