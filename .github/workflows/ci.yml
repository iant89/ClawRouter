name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # ENTERPRISE-UI comes from the committed tarball in vendor/.
      - run: bun install --frozen-lockfile
      # Spec §37: no committed credentials, no known-vulnerable dependencies.
      - run: bun run scan-secrets
      - run: bun audit
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
