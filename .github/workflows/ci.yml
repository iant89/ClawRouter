name: CI

on:
  push:
    branches: [main]
  pull_request:
  # SEC-018: new advisories are published without a push; check the dependencies weekly too.
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # ENTERPRISE-UI comes from the committed tarball in vendor/. --frozen-lockfile: bun.lock must match package.json.
      - run: bun install --frozen-lockfile
      # Spec §37: no committed credentials.
      - run: bun run scan-secrets
      # SEC-018: lockfile sources and hashes, licenses, and advisories (high and critical fail).
      - run: bun run deps:check
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      # SEC-019/020: the release artifacts (tarball, SBOMs, SHA256SUMS) build and verify on every change;
      # only the release workflow signs them.
      - run: bun run release:package --skip-build --out release
      - run: bun run release:verify release
